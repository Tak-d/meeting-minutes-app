<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 議事録ジェネレーター</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>AI 議事録ジェネレーター</h1>
    <p class="subtitle">音声ファイルから議事録を自動生成</p>
  </header>

  <main>
    <div class="container">
      <!-- 設定エリア -->
      <div class="section">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="meeting_admin_test_12345">
        <button id="saveKey">保存</button>
      </div>

      <!-- アップロードエリア -->
      <div class="section upload-area" id="dropZone">
        <p>音声ファイルをここにドラッグ＆ドロップ</p>
        <p class="small">または</p>
        <input type="file" id="fileInput" accept="audio/*" style="display: none;">
        <button id="selectFileBtn" class="primary">ファイルを選択</button>
        <p id="fileName" class="filename"></p>
      </div>

      <!-- 実行ボタン -->
      <button id="generateBtn" class="primary large" disabled>議事録を生成する</button>

      <!-- ローディング -->
      <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>音声を解析して議事録を作成中...（数分かかる場合があります）</p>
      </div>

      <!-- 結果エリア -->
      <div id="resultArea" class="result-area" style="display: none;">
        <h2>生成された議事録</h2>
        <div class="tabs">
          <button class="tab active" onclick="switchTab('minutes')">議事録</button>
          <button class="tab" onclick="switchTab('transcript')">文字起こし</button>
        </div>
        <div id="minutesContent" class="content-box"></div>
        <div id="transcriptContent" class="content-box" style="display: none;"></div>
        
        <button id="downloadBtn" class="primary">Markdownでダウンロード</button>
      </div>
    </div>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
